# Rosen et al. 2015, Movie 2 (flashing). Original: 176x144, 15 fps, 5.6 s, grayscale Crittercam footage.
# mantle: the squid carrying the camera (its mantle is the pale body at the bottom of the frame).
# squid2: the squid swimming at the right in the first frame; its box is tracked (the camera squid's mantle box stays fixed: tracking it lowered the flash detection, see README).
[rois]
mantle = [50, 108, 70, 20]
squid2 = [116, 70, 28, 48]

[tracking]
rois = ["squid2"]

# Spatial synchrony across the mantle ROI (rows, columns)
[grids]
mantle_grid = [50, 108, 70, 20, 2, 5]
